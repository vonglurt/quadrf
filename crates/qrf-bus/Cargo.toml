[package]
name = "qrf-bus"
version = "0.1.0"
description = "qrf.v1 feed-bus schema and ZeroMQ transport"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
bytes = "1.12.1"
prost = "0.14"
qrf-core = { version = "0.1.0", path = "../qrf-core" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
zeromq = "0.6"

[build-dependencies]
prost-build = "0.14"
protox = "0.10.0"
