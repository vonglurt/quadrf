[package]
name = "qrf-dsp"
version = "0.1.0"
description = "Channeliser, CFAR detector, bearing estimation and SIMD kernels"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
num-complex = "0.4.6"
rustfft = "6.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
libc = "0.2.190"
qrf-mipi = { version = "0.1.0", path = "../qrf-mipi" }

[[bench]]
name = "dsp"
harness = false
